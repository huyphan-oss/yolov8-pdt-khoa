# YOLOv8n-LR/Tucker optimized
# Accuracy-aware compression:
# - Keep P3 detection path unchanged for small-object accuracy.
# - Keep LRFuseC2f, but lower its rank ratio to reduce parameters.
# - Aggressively compress P5 while keeping P3/P4 stronger for accuracy.

# Parameters
nc: 1 # number of classes

scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]


# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [448, 3, 2]] # 5-P4/16
  - [-1, 3, LRFuseC2f, [448, True, 1, 0.5, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 7-P5/32
  - [-1, 3, LRTuckerC2f, [256, True, 1, 0.5, 0.125]]
  - [-1, 1, SPPF, [256, 5]] # 9

# YOLOv8.0n head with LRTuckerC2f
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, LRFuseC2f, [448, False, 1, 0.5, 0.25]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, LRFuseC2f, [448, False, 1, 0.5, 0.25]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 1, LRTuckerC2f, [256, False, 1, 0.5, 0.125]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)
